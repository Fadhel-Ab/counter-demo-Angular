<input #titleInput type="text" placeholder="Enter Todo item" />

<button (click)="store.add(titleInput.value); titleInput.value = ''">add</button>
<div style="display: flex; justify-content: center">
  <button (click)="store.setFilter('all')">All</button>
  <button (click)="store.setFilter('active')">Active</button>
  <button (click)="store.setFilter('done')">Done</button>
</div>
<p>{{ store.remaining() }} left</p>
<ul>
  @for (todo of store.visible(); track todo.id) {
    <li [class.done]="todo.done">
      <app-todo-row
        [todo]="todo"
        (toggled)="store.toggle($event)"
        (removed)="store.remove($event)"
      />
    </li>
  } @empty {
    <li>Nothing to do 🎉</li>
  }
</ul>
