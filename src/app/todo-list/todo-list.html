<input #titleInput type="text" placeholder="Enter Todo item" />

<button (click)="store.add(titleInput.value); titleInput.value = ''">add</button>
<p>{{ store.remaining() }} left</p>
<ul>
  @for (todo of store.todos(); track todo.id) {
    <li [class.done]="todo.done">
      <app-todo-row
        [todo]="todo"
        (toggled)="store.toggle($event)"
        (removed)="store.remove($event)"
      />
    </li>
  } @empty {
    <li>Nothing to do 🎉</li>
  }
</ul>
